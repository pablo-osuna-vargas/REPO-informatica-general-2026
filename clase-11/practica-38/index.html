<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Práctica 38 - Equipamiento</title>
	<link href="css/estilos.css" rel="stylesheet">
</head>

<body>
	<div id="contenedor">
		<header class="centrado">
			<h1>Práctica 38</h1>
				<h2>Equipamiento</h2>
		</header>

		<main>
			<form id="carga">
				<fieldset id="cargarDatos">
					<legend>Ingreso de equipos</legend>
						<label for="descripcion">Descripción de item:</label>
						<input type="text" name="descripcion" id="descripcion">

						<label for="estado">Estado:</label>
						<select id="estado">
							<option value="">Seleccionar...</option>
							<option value="prestado">prestado</option>
							<option value="no-prestado">NO prestado</option>
						</select>
						<br>
						<button id="cargarEquipo">Cargar equipo</button>
						<br>
						<button id="enviarDatos">Enviar Datos Cargados</button>

						<ul id="lista" disabled>Equipamiento disponible:</ul>
				</fieldset>

				<fieldset id="pedidos" disabled>
					<legend>Préstamo de equipos</legend>
						<label for="equipoDescripcion">Equipo pedido:</label>
						<input type="text" name="equipoDescripcion" id="equipoDescripcion">

						<label for="prestamoTiempo">Cant. días a préstamo:</label>
						<input type="number" name="prestamoTiempo" id="prestamoTiempo">
						<br>
						<button type="button" id="cargarPedido">Cargar Pedido individual</button>
						<br>
						<button type="button" id="enviarPedido">Enviar Pedido Total</button>
					</fieldset>
			</form>

			<ul id="mostrarInfo" disabled>Lista de pedidos:</ul>

			<button id="recargar">Recargar página</button>
		</main>

		<footer class="centrado">
				<p>Pablo Osuna Vargas | 2026 | Buenos Aires - Argentina</p>
				<a href="mailto:pabloosunavargas@gmail.com">pabloosunavargas@gmail.com</a>
		</footer>
	</div>

	<script src="js/script.js"></script>

</body>

</html>
