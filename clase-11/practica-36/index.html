<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Práctica 36 - Biblioteca</title>
	<link href="css/estilos.css" rel="stylesheet">
</head>

<body>
	<div id="contenedor">
		<header class="centrado">
			<h1>Práctica 36</h1>
				<h2>Biblioteca</h2>
		</header>

		<main>
			<form id="sistema">
				<label for="titulo">Título:</label>
				<input type="text" name="titulo" id="titulo">
				<br>
				<label for="Autor">Autor:</label>
				<input type="text" name="autor" id="autor">
				<br>
				<label for="año">Año:</label>
				<input type="number" name="number" id="año">
				<br>
				<label for="prestamo">En préstamo:</label>
				<select id="prestamo">
					<option value="si">SI</option>
					<option value="no">NO</option>
				</select>
			</form>

			<button type="button" id="ingresarDatos">Ingresar Datos</button>
			<button type="button" id="calcular">Calcular Datos</button>

			<p id="resultados"></p>
		</main>

		<footer class="centrado">
				<p>Pablo Osuna Vargas | 2026 | Buenos Aires - Argentina</p>
				<a href="mailto:pabloosunavargas@gmail.com">pabloosunavargas@gmail.com</a>
		</footer>
	</div>

	<script src="js/script.js"></script>

</body>

</html>
