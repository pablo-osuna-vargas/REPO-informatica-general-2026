<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Práctica 40 - Un día de shopping</title>
	<link href="css/estilos.css" rel="stylesheet">
</head>

<body>
	<div id="contenedor">
		<header class="centrado">
			<h1>Práctica 40</h1>
				<h2>Un día de shopping</h2>
		</header>

		<main>
			<form>
				<fieldset>
					<label for="item">Item comprado:</label>
					<input type="text" name="item" id="item">
						<br>
					<label for="precio">Precio:</label>
					<input type="number" name="precio" id="precio">
				</fieldset>

				<fieldset>
					<label for="medio">Medio de pago:</label>
					<label for="medio">Efectivo</label>
					<input type="checkbox" name="efectivo" id="efectivo" value="efectivo">
					<label for="medio">Débito</label>
					<input type="checkbox" name="debito" id="debito" value="debito">
					<label for="medio">Crédito</label>
					<input type="checkbox" name="credito" id="credito" value="credito">
				</fieldset>
			</form>

			<ul id="resultados" disabled></ul>
		</main>

		<footer class="centrado">
				<p>Pablo Osuna Vargas | 2026 | Buenos Aires - Argentina</p>
				<a href="mailto:pabloosunavargas@gmail.com">pabloosunavargas@gmail.com</a>
		</footer>
	</div>

	<script src="js/script.js"></script>

</body>

</html>
