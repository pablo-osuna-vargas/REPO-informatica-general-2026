<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Práctica 40 - Un día de shopping</title>
	<link href="css/estilos.css" rel="stylesheet">
</head>

<body>
	<div id="contenedor">
		<header class="centrado">
			<h1>Práctica 40</h1>
				<h2>Un día de shopping</h2>
		</header>

		<main>
			<form>
				<fieldset>
					<legend>Compras</legend>
						<label for="item">Item comprado:</label>
						<input type="text" name="item" id="item">
							<br>
						<label for="precio">Precio:</label>
						<input type="number" name="precio" id="precio">
				</fieldset>

				<fieldset>
					<legend>Medio de pago:</legend>
						<label for="medio">Efectivo</label>
							<input type="radio" name="efectivo" id="efectivo" value="efectivo">
						<label for="medio">Débito</label>
							<input type="radio" name="debito" id="debito" value="debito">
						<label for="medio">Crédito</label>
							<input type="radio" name="credito" id="credito" value="credito">
				</fieldset>

				<fieldset>
					<legend>cargar item</legend>
						<button type="button" id="cargarItem">cargar</button>
				</fieldset>

				<fieldset>
					<legend>Calcular Total de compra</legend>
						<button type="button" id="calcularTotalCompra">Total</button>
				</fieldset>
			</form>

			<div id="resultados" disabled></div>

			<button type="button" id="recargarPagina">Recargar página</button>
		</main>

		<footer class="centrado">
				<p>Pablo Osuna Vargas | 2026 | Buenos Aires - Argentina</p>
				<a href="mailto:pabloosunavargas@gmail.com">pabloosunavargas@gmail.com</a>
		</footer>
	</div>

	<script src="js/script.js"></script>

</body>

</html>
