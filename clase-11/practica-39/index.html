<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Práctica 39 - Atletas entrenando</title>
	<link href="css/estilos.css" rel="stylesheet">
</head>

<body>
	<div id="contenedor">
		<header class="centrado">
			<h1>Práctica 39</h1>
				<h2>Atletas entrenando</h2>
		</header>

		<main>
			<form id="cargar">
				<fieldset>
					<legend>Datos personales</legend>
						<label for="nombre">Nombre:</label>	
						<input type="text" name="nombre" id	="nombre">
							<br>
						<label for="adad">Edad:</label>
						<input type="number" name="edad" id="edad">
				</fieldset>
				
				<fieldset>
					<legend>Ejercicios</legend>
						<label for="fuerza">Fuerza</label>
						<input type="checkbox" id="fuerza" name="fuerza" value="fuerza">
							<br>
						<label for="flexibilidad">Flexibilidad</label>
						<input type="checkbox" id="flexibilidad" name="flexibilidad" value="flexibilidad">
							<br>
						<label for="resistencia">Resistencia</label>
						<input type="checkbox" id="resistencia" name="resistencia" value="resistencia">
				</fieldset>

				<fieldset>
					<legend>Tiempo</legend>
						<label for="minutos">Minutos:</label>
						<input type="number" name="minutos" id="minutos">
				</fieldset>

						<button id="cargarDatos">Cargar datos</button>
							<br>
						<button id="resumen">Resumen</button>
			</form>

			<p id="mostrarInfo"></p>

			<button id="recargar">Recargar página</button>
		</main>

		<footer class="centrado">
				<p>Pablo Osuna Vargas | 2026 | Buenos Aires - Argentina</p>
				<a href="mailto:pabloosunavargas@gmail.com">pabloosunavargas@gmail.com</a>
		</footer>
	</div>

	<script src="js/script.js"></script>

</body>

</html>
