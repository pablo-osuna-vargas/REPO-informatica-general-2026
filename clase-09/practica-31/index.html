<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
	<title>Práctica 31</title>
</head>

<body>
	<div id="contenedor">
		<main>
			<h1>Práctica 31</h1>
				<h2>Compras de clientes</h2>

				<form action="#" method="get">
					<fieldset>
						<legend>Punto</legend>

						<p>Apostá por un número haciendo click...</p>

						<button type="button" name="uno" id="uno" value="1"><img src="img/uno.png" alt="uno" width="10%"></button>
						<button type="button" name="dos" id="dos" value="2"><img src="img/dos.png" alt="dos" width="10%"></button>
						<button type="button" name="tres" id="tres" value="3"><img src="img/tres.png" alt="tres" width="10%"></button>
						<button type="button" name="cuatro" id="cuatro" value="4"><img src="img/cuatro.png" alt="cuatro" width="10%"></button>
						<button type="button" name="cinco" id="cinco" value="5"><img src="img/cinco.png" alt="cinco" width="10%"></button>
						<button type="button" name="seis" id="seis" value="6"><img src="img/seis.png" alt="seis" width="10%"></button>
					</fieldset>

					<fieldset>
						<legend>Banca</legend>

						<img id="imagen1" src="img/1.jpeg" alt="imagenUno" width="15%">
						<img id="imagen2" src="img/2.jpeg" alt="imagenDos" width="15%">
						<img id="imagen3" src="img/3.jpeg" alt="imagenTres" width="15%">
						<img id="imagen4" src="img/4.jpeg" alt="imagenCuatro" width="15%">
						<img id="imagen5" src="img/5.jpeg" alt="imagenCinco" width="15%">
					</fieldset>
				</form>

				<p id="mostrarCoincidencias"></p>

				<button id="borrar">Volver a apostar!</button>
		</main>
	</div>

	<script src="js/script.js"></script>

</body>
</html>
