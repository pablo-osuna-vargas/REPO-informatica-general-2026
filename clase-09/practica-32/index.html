<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
	<title>Práctica 32</title>
</head>

<body>
	<div id="contenedor">
		<main>
			<h1>Práctica 32</h1>
				<h2>Adivinar el número</h2>

				<form action="#" method="get">
					<fieldset>
						<legend>Ingresar datos</legend>
						<label for="nombre">Nombre</label>
						<input type="text" name="nombre" id="nombre">

						<label for="monto">Monto total</label>
						<input type="number" name="monto" id="monto">

						<button type="submit" id="enviarDatos">Enviar datos</button>
					</fieldset>

					<fieldset>
						<legend>Resumen</legend>
						<button type="button" id="totalClientesPromedio">Total Clientes/Promedio</button>
						<button type="button" id="descuento">Descuento</button>
					</fieldset>
				</form>

				<p id="mostrarTotalClientesPromedio"></p>
				<p id="mostrarMayorCompraDescuento"></p>
		</main>
	</div>

	<script src="js/script.js"></script>

</body>
</html>
