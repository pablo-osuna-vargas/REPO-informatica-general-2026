<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
	<title>Práctica 33</title>
</head>

<body>
	<div id="contenedor">
		<main>
			<h1>Práctica 33</h1>
				<h2>Corredores</h2>

				<form action="#" method="get">
					<fieldset>
						<legend>Ingreso de corredores</legend>
							<label for="nombre">Nombre: </label>
							<input type="text" name="nombre" id="nombre">

							<label for="apellido">Apellido: </label>
							<input type="text" name="apellido" id="apellido">

							<label for="participante">Participante No: </label>
							<input type="number" name="participante" id="participante">

							<label for="tiempo">Tiempo: </label>
							<input type="number" name="tiempo" id="tiempo">
					</fieldset>

					<button type="submit" id="enviar">Enviar Datos</button>
				</form>

				<button id="resultados">Resultados</button>

				<div id="mostrarResultados"></div>
		</main>
	</div>

	<script src="js/script.js"></script>

</body>
</html>
